plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Cloth Config
	maven { url = 'https://maven.shedaniel.me' }
	// Mod Menu
	maven { url = 'https://maven.terraformersmc.com/releases' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ai_translate" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config API (configuration screen)
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"

	// Mod Menu (config screen entry)
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit tests (pure logic: placeholders, path sanitising, cache keys)
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation sourceSets.client.output
}

tasks.named('test') {
	useJUnitPlatform()

	// Gradle hands the (very long) Minecraft classpath to the forked test worker
	// through a pathing jar. On Windows that breaks when the project path contains
	// non-ASCII characters: compilation still works, but the worker cannot resolve
	// the test classes. Instead of failing the whole build the tests are skipped
	// with a warning; run them from an ASCII path to execute them (see README).
	onlyIf {
		String projectPath = project.projectDir.absolutePath
		boolean asciiPath = projectPath.chars().allMatch { it < 128 }
		if (!asciiPath) {
			logger.warn("Skipping unit tests: project path contains non-ASCII characters ({}).", projectPath)
			logger.warn("Run the tests from an ASCII path, e.g. 'gradlew.bat test' inside C:/aitranslate.")
		}
		asciiPath
	}
}

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	// Surface deprecated API use instead of hiding it behind the generic note:
	// the mod only uses Minecraft's own APIs and the optional Cloth Config screen,
	// so a deprecation warning is always something worth looking at.
	it.options.compilerArgs << '-Xlint:deprecation'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "LICENSE_${project.findProperty('archives_base_name') ?: 'ai-translate'}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
